<!doctype html>
<!-- SHAPE: a thin-bodied 404. The resource is absent, which is true from every exit, so this must be
     reported blocked WITHOUT requesting a fresh residential exit (VIL-121). Body length is deliberately
     under MIN_CONTENT_LENGTH (200 chars of visible text). -->
<html lang="en">
  <head><title>Not Found</title></head>
  <body>
    <h1>Not Found</h1>
    <p>The requested page does not exist.</p>
    <p><a href="https://example.invalid/">Home</a></p>
  </body>
</html>
