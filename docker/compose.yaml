# Capped browser-core / gateway service.
#
# U2 defines the service and its resource caps. Later units harden it: U4 adds egress
# filtering + Tailscale-only network isolation (R13/R19), and U7 tunes the caps against
# measured headroom on the production host so a browser spike can't starve co-located agents
# (R2/AE4). The caps below are deliberate placeholders.
#
#   docker compose -f docker/compose.yaml up --build
services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: browse-gateway:latest
    init: true # reap Chrome's child processes (no zombies)
    # Must cover the WHOLE bounded shutdown sequence, because its last bounded step —
    # ArtifactRuntime.close() — is what releases the artifact root lock. Worst case is
    # 5s drain + 2x8s in closeAll (it spends cleanupAwaitMs twice, measured) + 10s artifact close = 31s;
    # Docker's default grace is 10s, so the default would SIGKILL with the lock still held. The lock is a
    # plain mkdir'd directory with no staleness reclamation, so that bricks every later boot with
    # artifact-root-locked. This is a ceiling, not a cost: an ordinary shutdown finishes in milliseconds.
    # Kept in step with worstCaseShutdownMs() by a test — see test/artifact-http-lifecycle.test.mjs.
    stop_grace_period: 45s
    shm_size: "1gb" # headful Chrome needs more than the 64MB default /dev/shm
    cpus: 2.0 # placeholder cap — tuned in U7
    mem_limit: 2gb # placeholder cap — tuned in U7
    pids_limit: 512 # contain runaway Chrome forks
    oom_score_adj: 500 # under memory pressure, kill this container before the host/agents
    # Security hardening (U4 / R13, R17, R19):
    cap_drop:
      - ALL # Chrome runs --no-sandbox, so no Linux capabilities are needed
    security_opt:
      - no-new-privileges:true
    # No `ports:` mapping — and deliberately so even for the U7a shared HTTP MCP surface. The
    # browser CDP is driven over a pipe (no TCP debugging port), so CDP stays local (R13/R17). The
    # HTTP launcher (`dist/mcp/http-main.js`) DOES open a listener, but a Docker `ports:` publish
    # binds ALL host interfaces — "Tailscale-only" is an overlay, not a Docker filter — so reaching
    # the MCP surface over the Tailnet is done by binding the listener to the Tailnet interface
    # (`BGW_HTTP_BIND`, default loopback / fail-closed) and routing via the Tailscale sidecar, NOT by
    # publishing a port. DNS-rebind protection (`BGW_ALLOWED_HOSTS`) guards the Host header on top.
    #
    # Egress filtering (R19) has two layers: the browser-layer host filter
    # (src/security/egress.ts) blocks metadata/private destinations on every request, and the
    # deployment adds a container-network egress rule (block 169.254.169.254 + RFC1918 +
    # Tailnet) via a NET_ADMIN init/sidecar — kept out of this capped service so it stays
    # cap_drop ALL. Wired in U7 against the live host.
    environment:
      BGW_CHANNEL: chrome
      BGW_NO_SANDBOX: "1"
      # U7a: with the shared HTTP service, held drive sessions share this global pool, so the cap
      # MUST be >= (consumers × BGW_PER_CONSUMER_MAX) + 1 retrieve headroom or http-main refuses to
      # boot. Raise from this placeholder for the real consumer count; tuned vs host headroom in U7.
      BGW_MAX_SESSIONS: "2"
      # BGW_PER_CONSUMER_MAX: "1"   # max concurrent drive sessions a single consumer may hold
      # --- Shared HTTP MCP surface (U7a, dist/mcp/http-main.js) ---
      # BGW_HTTP_BIND: "<tailnet-ip>"      # bind the listener Tailnet-only; default 127.0.0.1 (fail-closed)
      # BGW_HTTP_PORT: "8080"
      # BGW_ALLOWED_HOSTS: "<host:port>"   # REQUIRED for http-main — Host-header DNS-rebind allowlist;
      #                                    # the launcher refuses to boot without it (MCP clients send no
      #                                    # Origin, so Host validation is the load-bearing guard).
      # BGW_ALLOWED_ORIGINS: "<origin>"    # ADDITIONAL only (browser-origin defense) — never a substitute
      # BGW_CONSUMERS_MANIFEST: "/run/consumers.json"  # non-secret {id, allow}[] manifest path
      # BGW_ON_DATACENTER_IP: "1"
      # BYO proxy/CAPTCHA + per-consumer bearer tokens are injected at runtime from a store readable
      # only by this process (never baked into the image or committed). Tokens enter the redaction
      # set so they never reach logs/audit/errors (R9).
      # BGW_PROXY_URL / BGW_PROXY_USERNAME / BGW_PROXY_PASSWORD / BGW_CAPTCHA_API_KEY
      # BGW_CONSUMER_TOKEN_<ID>  (one per manifest entry, e.g. BGW_CONSUMER_TOKEN_ATLAS)
      # --- Per-call time bounds (issue #43), all optional; unset = the shipped defaults (behavior unchanged).
      # BGW_CALL_BUDGET_MS: "90000"           # global per-call wall-clock ceiling (retrieve escalation)
      # BGW_CLEARANCE_TIMEOUT_MS: "20000"     # direct-attempt clearance budget
      # BGW_PROXY_CLEARANCE_TIMEOUT_MS: "45000"  # proxied-attempt clearance budget
      # BGW_PROXY_NAV_TIMEOUT_MS: "25000"     # per-proxied-attempt navigation timeout
      # BGW_PROXY_MAX_ATTEMPTS: "3"           # max proxied re-roll attempts
      # BGW_CAPTCHA_SOLVE_TIMEOUT_MS: "120000"  # CAPTCHA solve deadline
    # Session-lifecycle bootstrap (U2). The image's ENTRYPOINT provisions Xvfb first, then exec's
    # this. The U1 kill-gate (validate-stealth.mjs, the image default), the U6 stdio MCP launcher
    # (dist/mcp/main.js), and the U7a shared HTTP launcher (dist/mcp/http-main.js) run other
    # commands against the same image.
    command: ["node", "dist/gateway/main.js"]
