# CI — typecheck + unit suite, then (on main only) build + publish the image.
#
# `test` runs on every PR and on pushes to main: the unit suite (`npm test` = tsc build +
# node --test). It needs no browser — the HTTP tests run over loopback with fakes, and the
# policy/verb tests use injected cores. The in-container stealth/drive/http kill-gates need real
# Chrome under Xvfb (amd64) and are intentionally NOT in CI; they run against the image at deploy.
#
# `build-image` runs ONLY on push to main, gated on `test` passing: it builds docker/Dockerfile
# natively on an amd64 runner (no QEMU/Rosetta — real Google Chrome is amd64-only) and pushes to
# GHCR, tagged with the short commit SHA and `latest`. Deploy stays manual (see the deploy plan);
# this job only produces a pullable, SHA-pinned image.
#
# Secrets: `BGW_DEPLOY_ID_KEY` (optional) plus the automatically-provisioned GITHUB_TOKEN, scoped to
# `packages: write` on the build-image job for the GHCR push. BGW_DEPLOY_ID_KEY is an HMAC key, NOT a
# credential — it authenticates nothing and grants no access. It keys the opaque deploy id stamped
# into the image (U1/KTD9), and its absence is a SUPPORTED build: the step warns and the image ships
# unstamped, reporting `deploy=none`. The repo is PUBLIC — no fleet/host/path detail appears here;
# the image name derives from github.repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22 # matches the Dockerfile (node:22-bookworm-slim)
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # Build the amd64 image and publish it to GHCR. Main-branch pushes only, after `test` passes.
  # PRs (incl. forks) skip this entirely — they neither need nor are allowed to push packages.
  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # amd64; builds Chrome's amd64 .deb natively
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/browse-gateway
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # U1 / KTD9 — compute the opaque deploy stamp: HMAC(secret, commit sha), truncated to 12 hex.
      #
      # Keyed on the COMMIT SHA, not the manifest digest. The digest is the hash of the built image,
      # so a digest-derived stamp would have to exist inside the thing it hashes — circular. The
      # commit sha is known before the build and is what the operator already has in hand, so
      # recovering "which commit is this deployment?" is a local HMAC over candidate commits: no
      # registry lookup, and no dependence on a token carrying `read:packages`.
      #
      # NO SECRET => NO STAMP. Never fall back to an empty key: an HMAC under a key everyone knows is
      # forgeable and derivable, which is strictly worse than an absent stamp, because it looks like
      # an identity. An unstamped image boots fine and reports `deploy=none`.
      - name: Compute deploy stamp
        id: stamp
        env:
          DEPLOY_ID_KEY: ${{ secrets.BGW_DEPLOY_ID_KEY }}
        run: |
          if [ -z "${DEPLOY_ID_KEY}" ]; then
            echo "::warning::BGW_DEPLOY_ID_KEY is not set — building an UNSTAMPED image (deploy=none). Consumers cannot distinguish two deploys of the same contract version until this secret exists."
            echo "deploy_id=" >> "$GITHUB_OUTPUT"
          else
            id="$(printf '%s' "${GITHUB_SHA}" | openssl dgst -sha256 -hmac "${DEPLOY_ID_KEY}" -hex | awk '{print $NF}' | cut -c1-12)"
            echo "deploy_id=${id}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BGW_DEPLOY_ID=${{ steps.stamp.outputs.deploy_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single-arch image consumed by a plain `docker pull :latest` on prod — skip the
          # provenance/SBOM attestations so the published manifest stays a clean single image
          # (no extra index / "unknown/unknown" platform entries).
          provenance: false
          sbom: false
